<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="5; url=/" />
  <title>Message Sent — Deepesh PJ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #0a0a0f;
      --text: #e8e8ef;
      --text-dim: #a0a0b0;
      --primary: #7c3aed;
      --accent: #06b6d4;
      --pink: #ec4899;
      --gradient: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #06b6d4 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.2), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.15), transparent 50%);
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2.5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      max-width: 500px;
      margin: 1rem;
      animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .icon-wrap {
      width: 100px;
      height: 100px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 0 60px rgba(124, 58, 237, 0.5);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .icon-wrap i {
      font-size: 3rem;
      color: white;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }
    p { color: var(--text-dim); margin-bottom: 2rem; line-height: 1.6; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2rem;
      background: var(--gradient);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: 0.3s;
      box-shadow: 0 6px 25px rgba(124, 58, 237, 0.4);
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 35px rgba(124, 58, 237, 0.6);
    }
    .redirect-note {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #6b6b80;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <i class="fa-solid fa-check"></i>
    </div>
    <h1>Message Sent!</h1>
    <p>Thanks for reaching out. I'll get back to you within 24 hours at the email you provided.</p>
    <a href="/" class="btn">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
    <p class="redirect-note">Redirecting in 5 seconds...</p>
  </div>
</body>
</html>
